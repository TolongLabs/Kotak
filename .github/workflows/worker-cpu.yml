name: Worker CPU

# TRD.md: the free plan allows a Worker request 10 ms of CPU, so MCP calls and Kopi's chat run in a Durable Object (#202).
# This reads the live CPU time, which only the account that owns the Worker can see: the status counts and CPU
# quantiles from the GraphQL Analytics API, then the outcome and CPU of each request type in a tail.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of analytics to read
        default: '24'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LIVE_URL: https://kotak.tp073654.workers.dev

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # https://developers.cloudflare.com/analytics/graphql-api/tutorials/querying-workers-metrics/
      # A status of exceededResources is error 1102 or 1027, most often CPU time.
      - name: Read status counts and CPU quantiles
        continue-on-error: true
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          start=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # shellcheck disable=SC2016 # $account, $start and $end are GraphQL variables, not shell ones.
          query='query ($account: string, $start: string, $end: string) {
            viewer { accounts(filter: {accountTag: $account}) {
              workersInvocationsAdaptive(limit: 100, filter: {scriptName: "kotak", datetime_geq: $start, datetime_leq: $end}) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 }
                dimensions { status }
              }
            } }
          }'
          jq -n --arg query "$query" --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg start "$start" --arg end "$end" \
            '{query: $query, variables: {account: $account, start: $start, end: $end}}' \
          | curl --silent --show-error --fail https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- \
          | jq '.errors // .data.viewer.accounts[0].workersInvocationsAdaptive'

      # Bursts of 12 calls each, told apart in the tail by a probe query parameter: the health route (Hono only),
      # tools/list (the MCP layer), run_checkup for one role (warm files), and run_checkup across 12 roles (new files).
      - name: Tail bursts by request type
        run: |
          bunx wrangler tail kotak --format json > tail.jsonl 2> tail.log &
          tail_pid=$!
          sleep 20
          mcp() {
            curl --silent --show-error -o /dev/null -w "$1 %{http_code}\n" -X POST "$LIVE_URL/api/mcp?probe=$1" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$2"
          }
          checkup() { echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"run_checkup\",\"arguments\":{\"role_code\":\"$1\",\"answers\":[]}}}"; }
          for _ in $(seq 12); do curl --silent -o /dev/null "$LIVE_URL/api/health?probe=health"; done
          for _ in $(seq 12); do mcp list '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'; done
          for _ in $(seq 12); do mcp same "$(checkup 15-1254.00)"; done
          for role in 11-1011.00 13-1161.00 13-2011.00 15-1252.00 15-1255.00 25-2021.00 29-1141.00 29-2061.00 41-2031.00 43-3031.00 53-3032.00 27-1024.00; do
            mcp new "$(checkup "$role")"
          done
          sleep 15
          kill "$tail_pid" || true
          cat tail.log
          jq -s 'map(select(.event.request.url // "" | test("probe=")))
            | group_by([(.event.request.url | capture("probe=(?<p>[a-z]+)").p), (.entrypoint // "Worker")])
            | map({probe: (.[0].event.request.url | capture("probe=(?<p>[a-z]+)").p), runs_in: (.[0].entrypoint // "Worker"),
                   outcomes: (group_by(.outcome) | map({(.[0].outcome): length}) | add), cpu_ms: [.[] | .cpuTime // empty]})' tail.jsonl
