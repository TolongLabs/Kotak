name: Worker CPU

# TRD.md: the free plan allows 10 ms of CPU per request, and a cold MCP check-up measured about 16 ms locally (#186).
# This reads the live Worker's real CPU time, which only the account that owns it can see: the status counts and
# CPU quantiles from the GraphQL Analytics API, then the outcome of each request in a burst of MCP calls, from a tail.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of analytics to read
        default: '24'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LIVE_URL: https://kotak.tp073654.workers.dev

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # https://developers.cloudflare.com/analytics/graphql-api/tutorials/querying-workers-metrics/
      # A status of exceededResources is error 1102 or 1027, most often CPU time.
      - name: Read status counts and CPU quantiles
        continue-on-error: true
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          start=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # shellcheck disable=SC2016 # $account, $start and $end are GraphQL variables, not shell ones.
          query='query ($account: string, $start: string, $end: string) {
            viewer { accounts(filter: {accountTag: $account}) {
              workersInvocationsAdaptive(limit: 100, filter: {scriptName: "kotak", datetime_geq: $start, datetime_leq: $end}) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 }
                dimensions { status }
              }
            } }
          }'
          jq -n --arg query "$query" --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg start "$start" --arg end "$end" \
            '{query: $query, variables: {account: $account, start: $start, end: $end}}' \
          | curl --silent --show-error --fail https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- \
          | jq '.errors // .data.viewer.accounts[0].workersInvocationsAdaptive'

      # Twelve roles, so most calls load role files the isolate hasn't parsed yet.
      - name: Tail a burst of MCP calls
        run: |
          bunx wrangler tail kotak --format json > tail.jsonl 2> tail.log &
          tail_pid=$!
          sleep 20
          for role in 11-1011.00 13-1161.00 13-2011.00 15-1252.00 15-1254.00 15-1255.00 25-2021.00 29-1141.00 29-2061.00 41-2031.00 43-3031.00 53-3032.00; do
            curl --silent --show-error -o /dev/null -w "$role %{http_code}\n" -X POST "$LIVE_URL/api/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"run_checkup\",\"arguments\":{\"role_code\":\"$role\",\"answers\":[]}}}"
          done
          sleep 15
          kill "$tail_pid" || true
          cat tail.log
          jq -s '[.[] | select(.event.request.url | test("/api/mcp"))]
            | {requests: length, outcomes: (group_by(.outcome) | map({(.[0].outcome): length}) | add),
               cpu_ms: [.[] | .cpuTime // empty], wall_ms: [.[] | .wallTime // empty]}' tail.jsonl
