name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kotak-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # TRD.md: Kopi's fixed lines are pre-generated with eleven_v4 and served as static MP3 files (#46, #150). Files are
      # named by a hash of the line, voice and model, and the script keeps existing ones, so credits go only to new
      # lines. A cache entry is never overwritten, so each run saves its own under the run id and restores the latest.
      # A line without a file is still spoken live, so a failure doesn't stop the deploy.
      - name: Restore pre-generated Kopi lines
        uses: actions/cache@v6
        with:
          path: apps/web/public/tts
          key: kopi-tts-${{ github.run_id }}
          restore-keys: kopi-tts-

      - name: Pre-generate Kopi's fixed lines
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: bun run tts:pregenerate

      - name: Build
        run: bun run build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            ELEVENLABS_API_KEY
            DATABASE_URL
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # TRD.md: the build writes the national view's labelled sample rows, at least 10 per occupation group (#147).
      # The seed replaces only rows where is_sample is true. It runs after the deploy, because the Worker it replaces
      # parses only 6-corner rows, and one sample role has 5 corners (#152).
      - name: Seed national view sample rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:seed

      - name: Check deployed health endpoint
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/api/health")
          if [ "$status" != "200" ]; then
            echo "Health check returned HTTP $status"
            exit 1
          fi

      # The MCP server at /api/mcp (#186) must list Kotak's tools. A 2025-era tools/list needs no initialize, and its
      # reply is SSE-framed, so the JSON is on the "data:" line.
      - name: Check deployed MCP tools
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --silent --show-error --fail -X POST "$DEPLOYMENT_URL/api/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
          | sed -n 's/^data: //p' \
          | jq -e '[.result.tools[].name] | debug | contains(["find_role", "get_checkup_questions", "run_checkup", "what_changed", "national_skill_gaps", "job_market", "list_sources"])'
